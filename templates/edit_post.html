<!doctype html><html><head><link rel="stylesheet" href="/static/style.css"><meta name="viewport" content="width=device-width"></head><body class="adminbody"><div class="dashboard" style="margin:auto"><a href="/admin#posts">← Dashboard</a><section class="panel"><h1>Edit article</h1><form method="post" enctype="multipart/form-data" class="formgrid"><label>Title<input name="title" value="{{post.title}}" required></label><label>Change photo<input type="file" name="image" accept="image/*"></label><label class="wide">Excerpt<textarea name="excerpt">{{post.excerpt or ''}}</textarea></label><label class="wide">Body<textarea name="body" rows="12">{{post.body or ''}}</textarea></label><label>SEO title<input name="seo_title" value="{{post.seo_title or ''}}"></label><label>Meta description<input name="meta_description" value="{{post.meta_description or ''}}"></label><label>Published<input type="checkbox" name="published" {% if post.published %}checked{% endif %}></label><button class="btn">Save changes</button></form></section></div></body></html>
